# Settings for the ds4 LaunchDaemon (com.sefk.ds4-server). bin/ds4-serve
# sources this on every start, so after editing run `bin/ds4ctl restart`;
# no redeploy needed. Shell syntax; $HOME is the daemon user's home.

DS4_DIR="$HOME/src/ds4"                       # ds4 checkout and build
DS4_MODEL="gguf/Qwen3.8-Flash-Next-Q2.gguf"   # relative to DS4_DIR
DS4_HOST="0.0.0.0"                            # LAN-visible; ds4 has no auth
DS4_PORT=8765                                 # clear of 8000, 8080, 1234, 11434
DS4_CTX=131072                                # 55.6 GiB planned with the Q2 pack
DS4_KV_DIR="$HOME/.ds4/server-kv"             # on-disk KV checkpoints
DS4_KV_MB=32768                               # their disk budget

# Speculative decoding off the model's own MTP head. The exact-sampling flag
# keeps temperature > 0 output identical to plain decoding (ds4's
# docs/SPECULATIVE_DECODING.md).
DS4_ARGS=(--mtp --mtp-exact-sampling)
